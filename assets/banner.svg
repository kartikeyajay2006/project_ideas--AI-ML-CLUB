<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Big ideas. Small first steps. Applied AI and Product Track project ideas">
<style>@font-face{font-family:BG8;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:DM4;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:DM5;src:url(data:font/woff2;base64,) format('woff2')}
.blob{transform-box:fill-box;transform-origin:center;animation:float 14s ease-in-out infinite}
@keyframes float{50%{transform:translate(60px,-50px) scale(1.15)}}
.u{animation:up .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(34px)}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 2.6s 1.2s cubic-bezier(.6,0,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<clipPath id="c"><rect width="1280" height="440" rx="28"/></clipPath>
<filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
<pattern id="d" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" opacity=".06"/></pattern>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="273.3917541503906" x2="1006.6082458496094" spreadMethod="repeat">
<stop offset="0" stop-color="#5ee0a8"/><stop offset=".33" stop-color="#6c8cff"/><stop offset=".66" stop-color="#ff7ab0"/><stop offset="1" stop-color="#5ee0a8"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="733.2 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="gb" x2="1"><stop offset="0" stop-color="#5ee0a8"/><stop offset=".5" stop-color="#6c8cff"/><stop offset="1" stop-color="#ff7ab0"/></linearGradient>
</defs>
<g clip-path="url(#c)">
<rect width="1280" height="440" fill="#0b100e"/>
<g filter="url(#b)" opacity=".55">
<circle class="blob" cx="150" cy="80" r="200" fill="hsl(160 80% 55%)" opacity=".5"/>
<circle class="blob" cx="1150" cy="420" r="230" fill="hsl(250 85% 65%)" opacity=".5" style="animation-delay:-5s"/>
<circle class="blob" cx="820" cy="210" r="140" fill="hsl(330 85% 65%)" opacity=".45" style="animation-delay:-9s"/>
</g>
<rect width="1280" height="440" fill="url(#d)"/>
<g class="u"><rect x="443.5" y="58" width="393" height="42" rx="21" fill="#131b17" stroke="#ffffff1f"/>
<text x="640" y="85" text-anchor="middle" font-family="DM5" font-size="17" fill="#9fb0a6">Applied AI &amp; Product Track · 6 project ideas</text></g>
<text class="u" x="640" y="206" text-anchor="middle" font-family="BG8" font-size="88" letter-spacing="-3" fill="#eef3ec" style="animation-delay:.15s">Big ideas.</text>
<text class="u" x="640" y="296" text-anchor="middle" font-family="BG8" font-size="88" letter-spacing="-3" fill="url(#g)" style="animation-delay:.45s">Small first steps.</text>
<text class="u" x="640" y="354" text-anchor="middle" font-family="DM4" font-size="19" fill="#9fb0a6" style="animation-delay:.8s">Six real problems to build for: what each one is, what to ship first, and where to learn.</text>
<rect class="bar" x="0" y="436" width="1280" height="4" fill="url(#gb)"/>
</g>
<rect x=".5" y=".5" width="1279" height="439" rx="27.5" fill="none" stroke="#ffffff1f"/>
</svg>